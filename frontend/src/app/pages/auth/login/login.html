<div class="login">
  <app-painel-marca />

  <main class="area">
    <div class="cartao">
      <div class="cartao__logo-mobile">
        <span class="cartao__logo-mobile-icone"><app-icone nome="logo" [tamanho]="20" /></span>
        Folha Conecta
      </div>

      <h2 class="cartao__titulo">Entrar</h2>
      <p class="cartao__subtitulo">Escolha como você acessa o sistema.</p>

      @if (sessaoExpirada) {
        <div class="aviso aviso--info" role="status">
          <app-icone nome="info" />
          Sua sessão expirou. Entre de novo para continuar de onde parou.
        </div>
      }

      <app-seletor-acesso [aba]="aba()" (abaChange)="trocarAba($event)" />

      <div id="painel-login" role="tabpanel" [attr.aria-labelledby]="'aba-' + aba()">
        @if (aba() === 'FUNCIONARIO') {
          <app-form-funcionario [carregando]="carregando()" [erro]="erro()" (enviar)="enviar($event)" />
        } @else {
          <app-form-empresa [carregando]="carregando()" [erro]="erro()" (enviar)="enviar($event)" />
        }
      </div>

      <p class="primeiro-acesso">
        Primeiro acesso? <a routerLink="/primeiro-acesso">Criar minha senha</a>
      </p>

      @if (demos.length) {
        <app-acessos-demo [demos]="demos" [carregando]="carregando()" (escolher)="entrarComoDemo($event)" />
      }
    </div>
  </main>
</div>
