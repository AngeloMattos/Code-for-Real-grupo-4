<form [formGroup]="form" (ngSubmit)="submeter()" novalidate>
  <div class="campo">
    <label class="campo__rotulo" for="cpf">CPF</label>
    <input
      id="cpf"
      class="campo__input"
      formControlName="cpf"
      inputmode="numeric"
      autocomplete="username"
      placeholder="000.000.000-00"
      maxlength="14"
      aria-describedby="cpf-erro"
      [attr.aria-invalid]="form.controls.cpf.touched && form.controls.cpf.invalid"
      (input)="formatarCpf($event)"
    />
    @if (form.controls.cpf.touched && form.controls.cpf.invalid) {
      <span id="cpf-erro" class="campo__erro">Informe os 11 dígitos do CPF.</span>
    }
  </div>

  <app-campo-senha [controle]="form.controls.senha" />
  <app-rodape-form [erro]="erro()" [carregando]="carregando()" />
</form>
