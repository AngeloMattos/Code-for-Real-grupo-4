services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: folhaconecta
      POSTGRES_USER: folha
      POSTGRES_PASSWORD: ${DB_PASSWORD:-folha}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folha -d folhaconecta"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
